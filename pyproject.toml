[project]
name = "quantum-design-env"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.9",
    "numpy>=1.26.4",
    "pip>=26.1.1",
    "pyvista>=0.48.4",
    "quantum-metal",
    "schemdraw>=0.22",
    "scikit-rf>=1.12.0",
    "scipy>=1.17.1",
    "sqdmetal",
]

[tool.uv.workspace]
members = [
    "quantum-metal",
    "SQDMetal",
]

[tool.uv.sources]
sqdmetal = { workspace = true, editable = true }
quantum-metal = { workspace = true }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
